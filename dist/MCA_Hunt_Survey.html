  <style>
/* MCA Hunting Survey PWA — mobile-first, large touch targets, offline field UI */
:root {
  --bg: #f4f6f4;
  --card: #ffffff;
  --ink: #16261c;
  --muted: #5c6b60;
  --line: #d6ddd6;
  --green: #256d40;
  --green-d: #1c5531;
  --amber: #b26a00;
  --red: #b3261e;
  --sel: #e3f2e8;
  --sel-line: #256d40;
  --radius: 12px;
  --tap: 48px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.4;
}
h1 { font-size: 1.5rem; margin: .2rem 0 .6rem; }
h2 { font-size: 1.2rem; margin: .8rem 0 .4rem; color: var(--green-d); }
button { font-family: inherit; }

.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between;
  align-items: center; gap: .5rem; padding: .6rem .9rem; background: var(--green);
  color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15);
}
.topbar .brand { font-weight: 700; }
.topbar .who { font-size: .85rem; opacity: .95; display: flex; align-items: center; gap: .4rem; }

.screen { max-width: 720px; margin: 0 auto; padding: .8rem .9rem 4rem; }
.setup { text-align: center; padding-top: 2rem; }
.setup p { color: var(--muted); }

/* Buttons */
.btn {
  min-height: var(--tap); padding: .6rem 1rem; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); border-radius: var(--radius);
  font-size: 1rem; cursor: pointer;
}
.btn.primary { background: var(--green); color: #fff; border-color: var(--green-d); font-weight: 600; }
.btn.danger { color: var(--red); border-color: #e6c3c1; }
.btn.ghost { background: transparent; }
.btn.big { width: 100%; font-size: 1.1rem; margin: .4rem 0 1rem; }
.btn.small { min-height: 40px; padding: .4rem .8rem; font-size: .95rem; }
.btn.tiny { min-height: 34px; padding: .2rem .6rem; font-size: .85rem; border-radius: 8px; }
.btn.tiny.ghost { color: #fff; border-color: rgba(255,255,255,.5); }

/* Interview list */
.ivlist { list-style: none; padding: 0; margin: .4rem 0; }
.ivrow {
  display: flex; align-items: center; gap: .5rem; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem .7rem; margin-bottom: .5rem;
}
.ivmain { flex: 1; cursor: pointer; }
.ivcode { font-weight: 700; }
.ivmeta { font-size: .8rem; color: var(--muted); display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin-top: .2rem; }
.empty { color: var(--muted); padding: .6rem; }
.exportbar { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.moreexport { margin-top: .6rem; }
.moreexport summary { color: var(--muted); font-size: .85rem; cursor: pointer; padding: .3rem 0; }
.foot { color: var(--muted); font-size: .8rem; margin-top: 1.4rem; }

/* Badges */
.badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
.badge.ok { background: #d9f0e1; color: var(--green-d); }
.badge.done { background: #e5ecff; color: #234; }
.badge.warn { background: #ffe9c9; color: var(--amber); }
.badge.miss { background: #fbdedb; color: var(--red); }

/* Stepper */
.stepper { display: flex; flex-wrap: wrap; gap: .35rem; margin: .2rem 0 .6rem; }
.stepdot {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--card); color: var(--muted); font-weight: 700; cursor: pointer;
}
.stepdot.active { background: var(--green); color: #fff; border-color: var(--green-d); }

/* Fields */
.field { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .7rem .8rem; margin-bottom: .7rem; }
.q { font-weight: 600; margin-bottom: .35rem; }
.q.small { font-size: .95rem; }
.help { color: var(--muted); font-size: .82rem; margin-bottom: .4rem; }
.note { background: #eef4ef; border-left: 4px solid var(--green); padding: .5rem .7rem; border-radius: 8px; color: var(--muted); margin-bottom: .7rem; font-size: .9rem; }
.subq { margin-top: .5rem; }

/* Option buttons (radio / checkbox as big tap targets) */
.options { display: flex; flex-direction: column; gap: .4rem; }
.opt {
  display: flex; align-items: center; gap: .6rem; min-height: var(--tap);
  padding: .5rem .7rem; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; background: #fff;
}
.opt.inline { display: inline-flex; margin: .2rem .4rem .2rem 0; }
/* Instant selected-highlight without needing a re-render (modern browsers).
   The .sel class (applied at render time) remains as a fallback. */
.opt.sel, .opt:has(input:checked) { border-color: var(--sel-line); background: var(--sel); }
.opt input { width: 22px; height: 22px; accent-color: var(--green); flex: 0 0 auto; }
.opt span { flex: 1; }

/* Text / select */
.txt, .drop { width: 100%; min-height: var(--tap); padding: .5rem .6rem; border: 1.5px solid var(--line); border-radius: 10px; font-size: 1rem; background: #fff; color: var(--ink); }
textarea.txt { min-height: 84px; resize: vertical; }
.txt.tiny { min-height: 38px; font-size: .9rem; }
.txt.num { max-width: 110px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.mono.big { font-size: 1.2rem; font-weight: 700; letter-spacing: .5px; }
.small { font-size: .82rem; }

/* Profile meta box */
.metabox .gpsrow { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }

/* Category block (Module B) */
.catblock { border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .6rem; margin-bottom: .8rem; background: #fbfdfb; }
.cathead { font-weight: 700; color: var(--green-d); border-bottom: 1px solid var(--line); padding-bottom: .3rem; margin-bottom: .5rem; }
.catblock .field { border: none; padding: .3rem 0; margin: 0; background: transparent; }

/* Trip block (Module F) */
.tripblock { border: 2px solid var(--sel-line); border-radius: var(--radius); padding: .5rem .7rem; margin-bottom: .9rem; }
.triphead { font-weight: 700; color: var(--green-d); margin-bottom: .5rem; }
.tripblock .field { background: #fbfdfb; }

/* Catch list */
.catchrow { display: flex; gap: .4rem; align-items: center; margin-bottom: .4rem; }
.catchrow .drop { flex: 1; }

/* Grids (Modules C, E, G, H) */
.legend { margin-bottom: .5rem; font-size: .85rem; }
.legend ul { columns: 2; padding-left: 1.1rem; margin: .4rem 0; }
.gridwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; }
table.grid { border-collapse: collapse; min-width: max-content; }
table.grid th, table.grid td { border: 1px solid var(--line); text-align: center; }
table.grid thead th { position: sticky; top: 0; background: #eef4ef; font-size: .8rem; padding: .3rem .35rem; z-index: 2; }
table.grid th.rowhead {
  position: sticky; left: 0; background: #eef4ef; text-align: left; padding: .4rem .5rem;
  font-size: .85rem; white-space: nowrap; z-index: 1;
}
table.grid thead th.rowhead { z-index: 3; }
table.grid th.disabled { color: #b7c2ba; }
.cell { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; cursor: pointer; }
.cell input { width: 22px; height: 22px; accent-color: var(--green); }
.cell.sel, .cell:has(input:checked) { background: var(--sel); }
.cellsel { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: .95rem; padding: .1rem .2rem; }
.na { color: #c2ccc4; }

/* Navigation */
.navbtns { display: flex; gap: .6rem; margin-top: 1rem; }
.navbtns .btn { flex: 1; }

/* Consent */
.consent { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem; line-height: 1.55; }

/* Review */
table.review { width: 100%; border-collapse: collapse; margin-top: .5rem; }
table.review td { border-bottom: 1px solid var(--line); padding: .35rem .4rem; vertical-align: top; }
table.review td:first-child { color: var(--muted); width: 42%; word-break: break-all; }

@media (min-width: 560px) {
  .options.cols2 { display: grid; grid-template-columns: 1fr 1fr; }
}

  </style>
</head>

 *
 * Per Section 7 of the handover, the species-category and method lists are
 * "pilot-refinable": keep them editable here rather than scattered through the
 * code so a category/method can be added, removed or renamed without a rebuild.
 *
 * Zone and Ward lists are NOT here — they are loaded at runtime from
 * data/reference.json (see 3.3) so the real lists can be dropped in without
 * touching code. This file only holds what Section 4 fixes for v1.
 */

const CONFIG = {
  // Bumped when the instrument/schema changes, written into every record as
  // `app_version` so exports can be traced to the build that produced them.
  appVersion: '1.0.0',

  // --- Fixed species categories (Section 4). Order is the canonical order used
  // for every grid row and every CSV column suffix. Edit here to refine. ---
  categories: [
    { code: 'pigeon',        label: 'Pigeon' },
    { code: 'wallaby',       label: 'Wallaby' },
    { code: 'tree_kangaroo', label: 'Tree kangaroo' },

    { code: 'snake',         label: 'Snake' },
    { code: 'bushfowl',      label: 'Bushfowl' },

    { code: '1',  label: 'Bow and arrow' },
    { code: '2',  label: 'Spear' },
    { code: '3',  label: 'Trap/snare (vine or bush material)' },
    { code: '4',  label: 'Trap/snare (wire or plastic)' },

    { code: '6',  label: 'Slingshot (mounted/larger)' },
    { code: '7',  label: 'Hunting dogs' },
    { code: '8',  label: 'Bush knife / hand capture' },
    { code: '9',  label: 'Smoking out burrow or hole' },
    { code: '10', label: 'Line or hook' },

    { code: 'sep', label: 'Sep' }, { code: 'oct', label: 'Oct' },

/*
 * db.js — local-first storage for interviews using IndexedDB.
 *
 * One object store, `interviews`, keyed by interview_id. Each record is the
 * full interview object (metadata + flat `data` map of field -> value). The
 * respondent name is kept in its own top-level `resp_name` field, deliberately
 * separate from `data`, so a name-excluded export is trivial (see 3.7).
 *
 * Everything is client-side; there is no network dependency (5.). All writes go
 * through put(), which the app calls on every field change for autosave (5.).
 */

const DB = (function () {
  const DB_NAME = 'mca_hunt';
  const DB_VERSION = 1;
  const STORE = 'interviews';
  let _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const store = db.createObjectStore(STORE, { keyPath: 'interview_id' });
          store.createIndex('by_status', 'interview_status', { unique: false });
          store.createIndex('by_updated', 'updated_at', { unique: false });
        }
      };
      req.onsuccess = (e) => { _db = e.target.result; resolve(_db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function tx(mode) {
    return open().then((db) => db.transaction(STORE, mode).objectStore(STORE));
  }

  function put(record) {
    record.updated_at = new Date().toISOString();
    return tx('readwrite').then((store) => new Promise((resolve, reject) => {
      const req = store.put(record);
      req.onsuccess = () => resolve(record);
      req.onerror = (e) => reject(e.target.error);
    }));
  }

  function get(id) {
    return tx('readonly').then((store) => new Promise((resolve, reject) => {
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = (e) => reject(e.target.error);
    }));
  }

  function getAll() {
    return tx('readonly').then((store) => new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => {
        const list = (req.result || []).sort((a, b) =>
          (b.updated_at || '').localeCompare(a.updated_at || ''));
        resolve(list);
      };
      req.onerror = (e) => reject(e.target.error);
    }));
  }

  function remove(id) {
    return tx('readwrite').then((store) => new Promise((resolve, reject) => {
      const req = store.delete(id);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e.target.error);
    }));
  }

  return { open, put, get, getAll, remove };
})();

window.DB = DB;

/*
 * export.js — flatten stored interviews to the canonical, flat coded-column
 * layout of Section 4 and emit CSV (priority) or JSON (secondary/raw).
 *
 * The column list here is the authoritative export contract. Repeated columns
 * (grids, per-category blocks, trip catch) are generated with the same NAMES
 * helpers the form renderer uses, so headers always match the fields collected.
 *
 * Design rules honoured:
 *  - resp_name lives outside `data` and can be excluded from an export (3.7).
 *  - No location field exists anywhere (3.2 / 3.7).
 *  - Booleans export as 1/0; multi-selects as ';'-joined codes; catch lists as
 *    per-category integer counts (f_<trip>_catch_<category>).
 */

const EXPORTER = (function () {
  const cats = () => CONFIG.categories.map((c) => c.code);
  const methods = () => CONFIG.methods.map((m) => m.code);
  const months = () => CONFIG.months.map((m) => m.code);
  const lifeStages = () => CONFIG.lifeStages.map((l) => l.code);

  // Column descriptors: { name, source } where source tells the flattener where
  // to read the value from a record. Built once per export (categories/methods
  // are config-driven so this reflects any pilot refinement automatically).
  function buildColumns() {
    const cols = [];
    const add = (name, source) => cols.push({ name, source: source || 'data' });

    // Module A + record-level identifiers
    add('interview_id', 'record');
    add('resp_id_code', 'record');
    add('resp_name', 'name');
    add('gps_lat', 'gps'); add('gps_lon', 'gps');
    add('gps_accuracy', 'gps'); add('gps_time', 'gps');
    add('sex'); add('age_band'); add('zone'); add('ward'); add('clan');
    ['activity_under_25', 'activity_25_39', 'activity_40_59', 'activity_60_plus'].forEach((n) => add(n));

    // Module B
    cats().forEach((c) => {
      add(NAMES.bTaken(c), 'bool');
      add(NAMES.bUseFood(c), 'bool');
      add(NAMES.bUseBilas(c), 'bool');
      add(NAMES.bUseCustomary(c), 'bool');
      add(NAMES.bUseSale(c), 'bool');
      add(NAMES.bUseOther(c));
    });
    add('b_other_category_name');
    add('b_other_category_taken');
    add('b_other_category_use_food', 'bool');
    add('b_other_category_use_bilas', 'bool');
    add('b_other_category_use_customary', 'bool');
    add('b_other_category_use_sale', 'bool');
    add('b_other_category_use_other');

    // Module C grid + trip questions
    cats().forEach((c) => methods().forEach((m) => add(NAMES.method(c, m), 'bool')));
    add('c_trip_style');
    add('c_method_changed');
    add('c_method_changed_previous', 'multi');
    add('c_usual_company');
    add('c_preferred_method');
    add('c_preferred_method_why');

    // Module D
    add('d_main_area');
    add('d_main_area_other');
    add('d_restricted_places', 'multi');
    add('d_restricted_places_other');

    // Module E grid
    cats().forEach((c) => months().forEach((mo) => add(NAMES.month(c, mo), 'bool')));

    // Module F
    add('f_source');
    ['recent', 'successful'].forEach((trip) => {
      add(NAMES.fTrip(trip, 'when'));
      add(NAMES.fTrip(trip, 'duration'));
      add(NAMES.fTrip(trip, 'style'));
      cats().forEach((c) => add(NAMES.catch(trip, c), 'catch'));
      add(NAMES.fTrip(trip, 'share_eaten'));
      add(NAMES.fTrip(trip, 'share_given'));
      add(NAMES.fTrip(trip, 'share_bilas'));
      add(NAMES.fTrip(trip, 'share_sold'));
    });
    add('f_typical_frequency');
    add('f_typical_duration');

    // Module G grid
    cats().forEach((c) => lifeStages().forEach((l) => add(NAMES.abundance(c, l))));
    add('g_people_change');
    add('g_change_text');

    // Module H
    add('h_rules_exist');
    cats().forEach((c) => {
      add(NAMES.hFood(c)); add(NAMES.hBilas(c)); add(NAMES.hSale(c)); add(NAMES.hNotes(c));
    });
    add('h_who_decides');
    add('h_who_decides_other');
    add('h_rules_changed');
    add('h_rules_changed_text');

    // Module I
    add('i_part_used', 'multi');
    add('i_part_used_other');
    add('i_occasion');
    add('i_who_does');
    add('i_who_does_other');
    add('i_income_importance');

    // Metadata
    add('interviewer_id', 'record');
    add('interview_start_time', 'record');
    add('interview_end_time', 'record');
    add('interview_status', 'record');
    add('sync_status', 'record');
    add('app_version', 'record');

    return cols;
  }

  // Read a single column value from a record, as a string suitable for CSV.
  function valueFor(record, col, includeName) {
    const data = record.data || {};
    switch (col.source) {
      case 'record':
        return record[col.name] == null ? '' : String(record[col.name]);
      case 'name':
        return includeName && record.resp_name ? String(record.resp_name) : '';
      case 'gps': {
        const g = record.gps || {};
        const map = { gps_lat: 'lat', gps_lon: 'lon', gps_accuracy: 'accuracy', gps_time: 'time' };
        const v = g[map[col.name]];
        return v == null ? '' : String(v);
      }
      case 'bool': {
        const v = data[col.name];
        if (v === true) return '1';
        if (v === false) return '0';
        return v == null ? '' : String(v);
      }
      case 'multi': {
        const v = data[col.name];
        return Array.isArray(v) ? v.join(';') : (v == null ? '' : String(v));
      }
      case 'catch': {
        // col.name = f_<trip>_catch_<category>; sum counts from the trip's list.
        const m = col.name.match(/^f_(recent|successful)_catch_(.+)$/);
        if (!m) return '';
        const list = data[`f_${m[1]}_catch`];
        if (!Array.isArray(list)) return '';
        const total = list
          .filter((row) => row && row.category === m[2])
          .reduce((sum, row) => sum + (parseInt(row.count, 10) || 0), 0);
        return total ? String(total) : '';
      }
      default: {
        const v = data[col.name];
        if (v === true) return '1';
        if (v === false) return '0';
        return v == null ? '' : String(v);
      }
    }
  }

  function csvCell(s) {
    if (s == null) s = '';
    s = String(s);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  // Build a CSV string for the given records. includeName controls whether the
  // resp_name column carries values (the column header is always present).
  function toCSV(records, includeName) {
    const cols = buildColumns();
    const header = cols.map((c) => csvCell(c.name)).join(',');
    const lines = [header];
    records.forEach((r) => {
      lines.push(cols.map((c) => csvCell(valueFor(r, c, includeName))).join(','));
    });
    return lines.join('\r\n');
  }

  function toJSON(records, includeName) {
    const clean = records.map((r) => {
      const copy = JSON.parse(JSON.stringify(r));
      if (!includeName) delete copy.resp_name;
      return copy;
    });
    return JSON.stringify(clean, null, 2);
  }

  function timestamp() {
    return new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  }

  // Trigger a client-side file download (works offline; no backend).
  function download(filename, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }

  return { buildColumns, valueFor, toCSV, toJSON, download, timestamp };
})();

window.EXPORTER = EXPORTER;


/*
 * app.js — controller, router and renderer for the MCA Hunting survey PWA.
 *
 * Fully client-side and offline-first: reference lists load from a bundled JSON
 * file, all state lives in IndexedDB (js/db.js), and every field change
 * autosaves. No network call is made at the point of data entry.
 */
(function () {
  'use strict';

  const $app = () => document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  // --- Local device / interviewer identity (localStorage) ------------------
  const LS = {
    interviewer: 'mca_interviewer_id',
    device: 'mca_device_prefix',
    seq: 'mca_seq',
  };

  function devicePrefix() {
    let p = localStorage.getItem(LS.device);
    if (!p) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      p = Array.from({ length: 3 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
      localStorage.setItem(LS.device, p);
    }
    return p;
  }
  function nextSeq() {
    const n = (parseInt(localStorage.getItem(LS.seq), 10) || 0) + 1;
    localStorage.setItem(LS.seq, String(n));
    return n;
  }
  function interviewerId() { return localStorage.getItem(LS.interviewer) || ''; }

  // Build a respondent ID code: <ZONE>-<DEVICE>-<SEQ> (see 3.5). Generated
  // locally, collision-safe via the per-device prefix, never typed by hand.
  function makeRespIdCode(zoneCode, seq) {
    const zone = (zoneCode || 'ZZ').toUpperCase();
    return `${zone}-${devicePrefix()}-${String(seq).padStart(3, '0')}`;
  }

  // --- App state -----------------------------------------------------------
  const state = { view: 'home', current: null, step: 0 };

  // --- Reference list loading (zones/wards) --------------------------------
  async function loadReference() {
    // Single-file build inlines the reference data on window.__MCA_REFERENCE__,
    // so it works when opened directly from disk (file://) with no fetch.
    if (window.__MCA_REFERENCE__) {
      const ref = window.__MCA_REFERENCE__;
      CONFIG.zones = Array.isArray(ref.zones) ? ref.zones : [];
      CONFIG.wards = Array.isArray(ref.wards) ? ref.wards : [];
      return;
    }
    try {
      const res = await fetch('data/reference.json', { cache: 'no-cache' });
      const ref = await res.json();
      CONFIG.zones = Array.isArray(ref.zones) ? ref.zones : [];
      CONFIG.wards = Array.isArray(ref.wards) ? ref.wards : [];
    } catch (e) {
      // Offline-safe: if the file can't be read, dropdowns simply show empty.
      CONFIG.zones = CONFIG.zones || [];
      CONFIG.wards = CONFIG.wards || [];
    }
  }

  // --- Interview model -----------------------------------------------------
  function newInterview() {
    const now = new Date().toISOString();
    return {
      interview_id: (crypto.randomUUID ? crypto.randomUUID()
        : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2)),
      resp_id_code: '',
      resp_name: '',
      gps: null,
      gps_status: 'pending',
      data: {},
      _seq: null,
      interviewer_id: interviewerId(),
      interview_start_time: now,
      interview_end_time: '',
      interview_status: 'in_progress',
      sync_status: 'not_exported',
      app_version: CONFIG.appVersion,
      created_at: now,
      updated_at: now,
      _step: 0,
    };
  }

  let saveTimer = null;
  // Immediate persist — used for every discrete choice (radio, checkbox, grid
  // cell, select) and navigation, so at most the current unsaved keystroke can
  // ever be lost if the app is killed (5. autosave).
  function save() {
    if (state.current) DB.put(state.current);
  }
  // Debounced persist — only for live free-text typing, to avoid a write per
  // keystroke. Flushes 250ms after typing stops.
  function saveDebounced() {
    if (!state.current) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { if (state.current) DB.put(state.current); }, 250);
  }

  function setData(field, value) {
    state.current.data[field] = value;
    // Regenerate the respondent ID whenever the zone is (re)selected.
    if (field === 'zone') {
      if (state.current._seq == null) state.current._seq = nextSeq();
      state.current.resp_id_code = makeRespIdCode(value, state.current._seq);
    }
    save();
  }

  // --- GPS capture (3.2) ---------------------------------------------------
  function captureGPS() {
    if (!state.current) return;
    state.current.gps_status = 'pending';
    if (!navigator.geolocation) {
      state.current.gps_status = 'missing';
      save(); if (state.view === 'module') renderModule(true);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        state.current.gps = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          time: new Date(pos.timestamp).toISOString(),
        };
        state.current.gps_status = 'ok';
        save();
        if (state.view === 'module') renderModule(true);
      },
      () => {
        state.current.gps_status = 'missing';
        save();
        if (state.view === 'module') renderModule(true);
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  // --- showIf evaluation ---------------------------------------------------
  function visible(field, data) {
    const c = field.showIf;
    if (!c) return true;
    const v = data[c.field];
    if (c.equals != null) return v === c.equals;
    if (c.notEmpty) return !!(v && String(v).trim());
    if (c.includes) return Array.isArray(v) && v.includes(c.includes);
    return true;
  }

  // Fields whose change must re-render the module (they gate other fields, or
  // drive the age-based grids / the respondent ID).
  function triggerFields(module) {
    const set = new Set(['age_band', 'zone']);
    module.fields.forEach((f) => { if (f.showIf) set.add(f.showIf.field); });
    return set;
  }

  // --- Field renderers (return HTML strings) -------------------------------
  function radioGroup(field, options, current) {
    return `<div class="options">` + options.map((o) => `
      <label class="opt ${current === o.code ? 'sel' : ''}">
        <input type="radio" name="${esc(field)}" value="${esc(o.code)}"
          data-field="${esc(field)}" ${current === o.code ? 'checked' : ''}>
        <span>${esc(o.label)}</span>
      </label>`).join('') + `</div>`;
  }

  function multiGroup(field, options, currentArr) {
    const cur = Array.isArray(currentArr) ? currentArr : [];
    return `<div class="options">` + options.map((o) => `
      <label class="opt ${cur.includes(o.code) ? 'sel' : ''}">
        <input type="checkbox" data-field="${esc(field)}" data-multi="1" value="${esc(o.code)}"
          ${cur.includes(o.code) ? 'checked' : ''}>
        <span>${esc(o.label)}</span>
      </label>`).join('') + `</div>`;
  }

  function boolButton(field, label, checked) {
    return `<label class="opt inline ${checked ? 'sel' : ''}">
      <input type="checkbox" data-field="${esc(field)}" ${checked ? 'checked' : ''}>
      <span>${esc(label)}</span></label>`;
  }

  function selectEl(field, options, current) {
    const opts = ['<option value="">— select —</option>'].concat(
      options.map((o) => `<option value="${esc(o.code)}" ${current === o.code ? 'selected' : ''}>${esc(o.label)}</option>`)
    ).join('');
    return `<select class="drop" data-field="${esc(field)}">${opts}</select>`;
  }

  function textEl(field, value, multiline) {
    if (multiline) {
      return `<textarea class="txt" data-field="${esc(field)}" rows="3">${esc(value || '')}</textarea>`;
    }
    return `<input class="txt" type="text" data-field="${esc(field)}" value="${esc(value || '')}">`;
  }

  function labelBlock(label, help, inner) {
    return `<div class="field">
      ${label ? `<div class="q">${esc(label)}</div>` : ''}
      ${help ? `<div class="help">${esc(help)}</div>` : ''}
      ${inner}</div>`;
  }

  // Module A profile meta (ID + GPS status + retry)
  function renderProfileMeta() {
    const r = state.current;
    let gps = '';
    if (r.gps_status === 'ok' && r.gps) {
      gps = `<span class="badge ok">GPS captured</span>
        <span class="mono">${r.gps.lat.toFixed(5)}, ${r.gps.lon.toFixed(5)} (±${Math.round(r.gps.accuracy)}m)</span>`;
    } else if (r.gps_status === 'pending') {
      gps = `<span class="badge warn">Getting GPS…</span>`;
    } else {
      gps = `<span class="badge miss">GPS missing</span>`;
    }
    return `<div class="field metabox">
      <div class="q">Respondent ID</div>
      <div class="mono big">${esc(r.resp_id_code || '— set once Zone is chosen —')}</div>
      <div class="q" style="margin-top:.6rem">Interview location (GPS)</div>
      <div class="gpsrow">${gps}
        <button class="btn tiny" data-action="gps-retry" type="button">Retry GPS</button></div>
      <div class="help">GPS records where the interview happens — never where people hunt/fish/gather.</div>
    </div>`;
  }

  // Category × method / category × month boolean grid
  function renderGridBool(field) {
    const rows = SCHEMA.resolveOptions(field.rows);
    const cols = SCHEMA.resolveOptions(field.cols);
    const data = state.current.data;
    let legend = '';
    if (field.cols === 'methods') {
      legend = `<details class="legend"><summary>Method code legend</summary><ul>` +
        cols.map((c) => `<li><b>${esc(c.code)}</b> — ${esc(c.label)}</li>`).join('') + `</ul></details>`;
    }
    let html = `${legend}<div class="gridwrap"><table class="grid"><thead><tr><th class="rowhead">Category</th>` +
      cols.map((c) => `<th title="${esc(c.label)}">${esc(field.cols === 'methods' ? c.code : c.label)}</th>`).join('') +
      `</tr></thead><tbody>`;
    rows.forEach((r) => {
      html += `<tr><th class="rowhead">${esc(r.label)}</th>`;
      cols.forEach((c) => {
        const name = field.nameFn(r.code, c.code);
        const on = data[name] === true;
        html += `<td><label class="cell ${on ? 'sel' : ''}">
          <input type="checkbox" data-field="${esc(name)}" ${on ? 'checked' : ''}>
          <span aria-hidden="true"></span></label></td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }

  // Category × life-stage single-choice (M/S/F/N/X), age-gated columns (Module G)
  function renderGridSingle(field) {
    const rows = SCHEMA.resolveOptions(field.rows);
    const cols = SCHEMA.resolveOptions(field.cols);
    const opts = SCHEMA.resolveOptions(field.options);
    const data = state.current.data;
    const allowed = field.ageGated
      ? CONFIG.enterableLifeStages(data.age_band) : cols.map((c) => c.code);
    let html = `<div class="gridwrap"><table class="grid"><thead><tr><th class="rowhead">Category</th>` +
      cols.map((c) => `<th class="${allowed.includes(c.code) ? '' : 'disabled'}">${esc(c.label)}</th>`).join('') +
      `</tr></thead><tbody>`;
    rows.forEach((r) => {
      html += `<tr><th class="rowhead">${esc(r.label)}</th>`;
      cols.forEach((c) => {
        const name = field.nameFn(r.code, c.code);
        const on = allowed.includes(c.code);
        const cur = data[name] || '';
        const optHtml = ['<option value="">–</option>'].concat(
          opts.map((o) => `<option value="${esc(o.code)}" ${cur === o.code ? 'selected' : ''}>${esc(o.code)}</option>`)
        ).join('');
        html += `<td>${on
          ? `<select class="cellsel" data-field="${esc(name)}">${optHtml}</select>`
          : `<span class="na">–</span>`}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }

  // Module H rules grid: category × (food/bilas/sale coded 0/1/2) + notes
  function renderRulesGrid(field) {
    const rows = CONFIG.categories;
    const opts = CONFIG.options.h_rule_score;
    const data = state.current.data;
    const sel = (name) => {
      const cur = data[name] || '';
      const o = ['<option value="">–</option>'].concat(
        opts.map((x) => `<option value="${esc(x.code)}" ${cur === x.code ? 'selected' : ''}>${esc(x.code)}</option>`)
      ).join('');
      return `<select class="cellsel" data-field="${esc(name)}">${o}</select>`;
    };
    let html = `<div class="help">0 = allowed · 1 = allowed with conditions · 2 = not allowed</div>
      <div class="gridwrap"><table class="grid"><thead><tr>
      <th class="rowhead">Category</th><th>Food</th><th>Bilas</th><th>Sale</th><th>Notes</th></tr></thead><tbody>`;
    rows.forEach((r) => {
      html += `<tr><th class="rowhead">${esc(r.label)}</th>
        <td>${sel(NAMES.hFood(r.code))}</td>
        <td>${sel(NAMES.hBilas(r.code))}</td>
        <td>${sel(NAMES.hSale(r.code))}</td>
        <td><input class="txt tiny" type="text" data-field="${esc(NAMES.hNotes(r.code))}"
          value="${esc(data[NAMES.hNotes(r.code)] || '')}"></td></tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }

  // Module A life-stage activity grid (age-gated rows)
  function renderActivityGrid(field) {
    const data = state.current.data;
    const allowed = CONFIG.enterableLifeStages(data.age_band);
    const fieldFor = { under_25: 'activity_under_25', '25_39': 'activity_25_39',
      '40_59': 'activity_40_59', '60_plus': 'activity_60_plus' };
    let html = `<div class="field"><div class="q">${esc(field.label)}</div>
      <div class="help">${esc(field.help || '')}</div>`;
    CONFIG.lifeStages.forEach((ls) => {
      if (!allowed.includes(ls.code)) return;
      const fname = fieldFor[ls.code];
      const opts = ls.code === 'under_25'
        ? CONFIG.options.activity_under_25 : CONFIG.options.activity_other;
      html += `<div class="subq"><div class="q small">${esc(ls.label)}</div>
        ${radioGroup(fname, opts, data[fname])}</div>`;
    });
    html += `</div>`;
    return html;
  }

  // Module B per-category block
  function renderPerCategory(field) {
    const data = state.current.data;
    let html = '';
    CONFIG.categories.forEach((c) => {
      html += `<div class="catblock"><div class="cathead">${esc(c.label)}</div>`;
      html += labelBlock(field.taken.label,
        '', radioGroup(field.taken.field(c.code), SCHEMA.resolveOptions(field.taken.options), data[field.taken.field(c.code)]));
      html += `<div class="field"><div class="q">Used for</div><div class="options">` +
        field.uses.map((u) => boolButton(u.field(c.code), u.label, data[u.field(c.code)] === true)).join('') +
        `</div></div>`;
      html += labelBlock(field.otherText.label, '', textEl(field.otherText.field(c.code), data[field.otherText.field(c.code)]));
      html += `</div>`;
    });
    return html;
  }

  // Module F catch list (repeatable {category, count})
  function renderCatchList(field) {
    const data = state.current.data;
    const key = `f_${field.trip}_catch`;
    const list = Array.isArray(data[key]) ? data[key] : [];
    let rows = list.map((row, i) => {
      const opts = ['<option value="">— category —</option>'].concat(
        CONFIG.categories.map((c) => `<option value="${esc(c.code)}" ${row.category === c.code ? 'selected' : ''}>${esc(c.label)}</option>`)
      ).join('');
      return `<div class="catchrow">
        <select class="drop" data-catch="category" data-trip="${esc(field.trip)}" data-idx="${i}">${opts}</select>
        <input class="txt num" type="number" min="0" inputmode="numeric" placeholder="count"
          data-catch="count" data-trip="${esc(field.trip)}" data-idx="${i}" value="${esc(row.count == null ? '' : row.count)}">
        <button class="btn tiny danger" type="button" data-action="catch-remove" data-trip="${esc(field.trip)}" data-idx="${i}">✕</button>
      </div>`;
    }).join('');
    return `<div class="field"><div class="q">${esc(field.label)}</div>
      <div class="catchlist">${rows || '<div class="help">No catch rows yet.</div>'}</div>
      <button class="btn small" type="button" data-action="catch-add" data-trip="${esc(field.trip)}">+ Add catch row</button></div>`;
  }

  // Generic field dispatcher
  function renderField(field) {
    const data = state.current.data;
    if (!visible(field, data)) return '';
    switch (field.kind) {
      case 'profile_meta': return renderProfileMeta();
      case 'note': return `<div class="note">${esc(field.text)}</div>`;
      case 'single': {
        let opts = SCHEMA.resolveOptions(field.options);
        // Wards may optionally be scoped to the selected zone (reference.json
        // entries with a `zone` property); entries without one show for all.
        if (field.scopeByZone && data.zone) {
          const scoped = opts.filter((o) => !o.zone || o.zone === data.zone);
          if (scoped.length) opts = scoped;
        }
        return labelBlock(field.label, field.help,
          field.dropdown ? selectEl(field.name, opts, data[field.name])
            : radioGroup(field.name, opts, data[field.name]));
      }
      case 'multi':
        return labelBlock(field.label, field.help,
          multiGroup(field.name, SCHEMA.resolveOptions(field.options), data[field.name]));
      case 'boolean':
        return `<div class="field"><div class="options">${boolButton(field.name, field.label, data[field.name] === true)}</div></div>`;
      case 'text':
        return labelBlock(field.label, field.help, textEl(field.name, data[field.name], false));
      case 'textarea':
        return labelBlock(field.label, field.help, textEl(field.name, data[field.name], true));
      case 'activity_grid': return renderActivityGrid(field);
      case 'per_category': return renderPerCategory(field);
      case 'grid_bool': return labelBlock('', '', renderGridBool(field));
      case 'grid_single': return labelBlock('', '', renderGridSingle(field));
      case 'rules_grid': return renderRulesGrid(field);
      case 'catch_list': return renderCatchList(field);
      case 'trip_block': {
        const inner = SCHEMA.tripBlockFields(field.trip).map(renderField).join('');
        return `<div class="tripblock"><div class="triphead">${esc(field.heading)}</div>${inner}</div>`;
      }
      default: return '';
    }
  }

  // --- Screens -------------------------------------------------------------
  function header() {
    return `<div class="topbar">
      <div class="brand">MCA Hunting Survey</div>
      <div class="who">${esc(interviewerId() || '')} <button class="btn tiny ghost" data-action="change-interviewer">change</button></div>
    </div>`;
  }

  function statusBadge(r) {
    if (r.interview_status === 'complete') {
      return r.sync_status === 'exported'
        ? '<span class="badge ok">complete · exported</span>'
        : '<span class="badge done">complete · not exported</span>';
    }
    return '<span class="badge warn">in progress</span>';
  }

  async function renderHome() {
    state.view = 'home';
    const list = await DB.getAll();
    const rowsHtml = list.length ? list.map((r) => `
      <li class="ivrow" data-id="${esc(r.interview_id)}">
        <div class="ivmain" data-action="open" data-id="${esc(r.interview_id)}">
          <div class="ivcode">${esc(r.resp_id_code || '(no ID yet)')}</div>
          <div class="ivmeta">${statusBadge(r)} <span class="mono">${esc((r.updated_at || '').slice(0, 16).replace('T', ' '))}</span>
            ${r.gps_status === 'missing' ? '<span class="badge miss">no GPS</span>' : ''}</div>
        </div>
        <button class="btn tiny danger" data-action="delete" data-id="${esc(r.interview_id)}">Delete</button>
      </li>`).join('') : '<li class="empty">No interviews on this device yet.</li>';

    $app().innerHTML = header() + `
      <div class="screen">
        <button class="btn primary big" data-action="new">+ New interview</button>
        <h2>Interviews on this device (${list.length})</h2>
        <ul class="ivlist">${rowsHtml}</ul>
        <div class="exportbar">
          <button class="btn primary" data-action="send-csv">Send interviews (with names)</button>
          <button class="btn" data-action="send-csv-anon">Send (no names)</button>
        </div>
        <details class="moreexport">
          <summary>Other export options</summary>
          <div class="exportbar">
            <button class="btn" data-action="export-csv">Download CSV (with names)</button>
            <button class="btn" data-action="export-csv-anon">Download CSV (no names)</button>
            <button class="btn ghost" data-action="export-json">Download JSON (raw)</button>
          </div>
        </details>
        <div class="foot">Offline-first · data stays on this device until you export. App v${esc(CONFIG.appVersion)}</div>
      </div>`;
  }

  function renderConsent() {
    state.view = 'consent';
    $app().innerHTML = header() + `
      <div class="screen">
        <h2>Consent</h2>
        <div class="consent">${esc(CONFIG.consentScript).replace(/\n/g, '<br>')}</div>
        <div class="navbtns">
          <button class="btn danger" data-action="consent-decline">Consent declined — cancel</button>
          <button class="btn primary" data-action="consent-give">Consent given — start</button>
        </div>
      </div>`;
  }

  function stepper() {
    const mods = SCHEMA.modules;
    return `<div class="stepper">` + mods.map((m, i) => `
      <button class="stepdot ${i === state.step ? 'active' : ''}" data-action="goto-step" data-step="${i}">${esc(m.id)}</button>`).join('') + `</div>`;
  }

  function renderModule(preserveScroll) {
    state.view = 'module';
    const y = preserveScroll ? window.scrollY : 0;
    const mod = SCHEMA.modules[state.step];
    const body = mod.fields.map(renderField).join('');
    const last = state.step === SCHEMA.modules.length - 1;
    $app().innerHTML = header() + `
      <div class="screen">
        ${stepper()}
        <h2>${esc(mod.title)}</h2>
        <div class="modbody">${body}</div>
        <div class="navbtns">
          <button class="btn" data-action="prev">${state.step === 0 ? 'Home' : 'Back'}</button>
          <button class="btn primary" data-action="next">${last ? 'Review' : 'Next'}</button>
        </div>
        <div class="foot">Every question can be left blank. Progress saves automatically.</div>
      </div>`;
    window.scrollTo(0, y);
  }

  function renderReview() {
    state.view = 'review';
    const r = state.current;
    const cols = EXPORTER.buildColumns();
    const rowsHtml = cols.map((c) => {
      const v = EXPORTER.valueFor(r, c, true);
      if (v === '' || v == null) return '';
      return `<tr><td class="mono small">${esc(c.name)}</td><td>${esc(v)}</td></tr>`;
    }).filter(Boolean).join('');
    $app().innerHTML = header() + `
      <div class="screen">
        <h2>Review — ${esc(r.resp_id_code || '(no ID)')}</h2>
        <div class="help">Only answered fields are shown (${rowsHtml ? '' : 'none yet'}).</div>
        <table class="review"><tbody>${rowsHtml}</tbody></table>
        <div class="navbtns">
          <button class="btn" data-action="back-to-form">Back to edit</button>
          <button class="btn primary" data-action="complete">Complete interview</button>
        </div>
      </div>`;
  }

  // --- First-run interviewer setup ----------------------------------------
  function renderInterviewerSetup() {
    state.view = 'setup';
    $app().innerHTML = `
      <div class="screen setup">
        <h1>MCA Hunting Survey</h1>
        <p>Before you start, enter your interviewer name or ID. It is stored on this device and recorded with each interview.</p>
        <input class="txt" id="setup-name" type="text" placeholder="e.g. Jane K. or INT-03" value="${esc(interviewerId())}">
        <button class="btn primary big" data-action="save-interviewer">Save and continue</button>
      </div>`;
  }

  // --- Event handling ------------------------------------------------------
  function onChange(e) {
    const t = e.target;
    // Catch-list row edits
    if (t.dataset && t.dataset.catch) {
      const trip = t.dataset.trip, idx = parseInt(t.dataset.idx, 10);
      const key = `f_${trip}_catch`;
      const list = Array.isArray(state.current.data[key]) ? state.current.data[key] : [];
      if (!list[idx]) list[idx] = { category: '', count: '' };
      list[idx][t.dataset.catch] = t.value;
      state.current.data[key] = list;
      save();
      return;
    }
    if (!t.dataset || !t.dataset.field) return;
    const field = t.dataset.field;
    let rerender = false;
    if (t.type === 'radio') {
      setData(field, t.value);
      rerender = true;
    } else if (t.type === 'checkbox' && t.dataset.multi) {
      const cur = Array.isArray(state.current.data[field]) ? state.current.data[field].slice() : [];
      const i = cur.indexOf(t.value);
      if (t.checked && i < 0) cur.push(t.value);
      if (!t.checked && i >= 0) cur.splice(i, 1);
      setData(field, cur);
      rerender = true;
    } else if (t.type === 'checkbox') {
      setData(field, t.checked);
    } else {
      // select / text / textarea / number
      setData(field, t.value);
      rerender = true; // change fires on blur for text/select — safe to refresh dependents
    }
    if (rerender && state.view === 'module') {
      const mod = SCHEMA.modules[state.step];
      if (triggerFields(mod).has(field) || field.startsWith('activity_')) renderModule(true);
    }
  }

  function onInput(e) {
    const t = e.target;
    if (t.dataset && t.dataset.catch) return; // handled on change
    if (!t.dataset || !t.dataset.field) return;
    // Live-save text typing without re-rendering (keeps focus). Debounced so we
    // don't write on every keystroke; blur ('change') will do a final save.
    if (t.type === 'text' || t.tagName === 'TEXTAREA' || t.type === 'number') {
      state.current.data[t.dataset.field] = t.value;
      saveDebounced();
    }
  }

  async function onClick(e) {
    const a = e.target.closest('[data-action]');
    if (!a) return;
    const action = a.dataset.action;

    switch (action) {
      case 'save-interviewer': {
        const v = document.getElementById('setup-name').value.trim();
        if (!v) { alert('Please enter a name or ID.'); return; }
        localStorage.setItem(LS.interviewer, v);
        renderHome();
        return;
      }
      case 'change-interviewer': renderInterviewerSetup(); return;
      case 'new': renderConsent(); return;
      case 'consent-decline': renderHome(); return; // no record saved
      case 'consent-give': {
        state.current = newInterview();
        state.step = 0;
        await DB.put(state.current);
        captureGPS();
        renderModule();
        return;
      }
      case 'open': {
        const rec = await DB.get(a.dataset.id);
        if (!rec) return;
        state.current = rec;
        state.step = rec.interview_status === 'complete' ? 0 : (rec._step || 0);
        if (rec.interview_status === 'complete') renderReview(); else renderModule();
        return;
      }
      case 'delete': {
        if (confirm('Delete this interview permanently?')) { await DB.remove(a.dataset.id); renderHome(); }
        return;
      }
      case 'gps-retry': captureGPS(); return;
      case 'prev':
        if (state.step === 0) { renderHome(); }
        else { state.step--; state.current._step = state.step; save(); renderModule(); }
        return;
      case 'next':
        if (state.step === SCHEMA.modules.length - 1) { renderReview(); }
        else { state.step++; state.current._step = state.step; save(); renderModule(); }
        return;
      case 'goto-step':
        state.step = parseInt(a.dataset.step, 10);
        state.current._step = state.step; save(); renderModule();
        return;
      case 'catch-add': {
        const key = `f_${a.dataset.trip}_catch`;
        const list = Array.isArray(state.current.data[key]) ? state.current.data[key] : [];
        list.push({ category: '', count: '' });
        state.current.data[key] = list; save(); renderModule(true);
        return;
      }
      case 'catch-remove': {
        const key = `f_${a.dataset.trip}_catch`;
        const list = Array.isArray(state.current.data[key]) ? state.current.data[key] : [];
        list.splice(parseInt(a.dataset.idx, 10), 1);
        state.current.data[key] = list; save(); renderModule(true);
        return;
      }
      case 'back-to-form': renderModule(); return;
      case 'complete': {
        state.current.interview_status = 'complete';
        state.current.interview_end_time = new Date().toISOString();
        await DB.put(state.current);
        state.current = null;
        renderHome();
        return;
      }
      case 'send-csv': return doSend(true);
      case 'send-csv-anon': return doSend(false);
      case 'export-csv': return doExport('csv', true);
      case 'export-csv-anon': return doExport('csv', false);
      case 'export-json': return doExport('json', true);
    }
  }

  // Collect the records to export (completed only; fall back to all if none
  // are complete yet, so a test run can still be exported).
  function recordsToExport(all) {
    const completed = all.filter((r) => r.interview_status === 'complete');
    return { records: completed.length ? completed : all, completed };
  }

  async function markExported(completed) {
    for (const r of completed) {
      if (r.sync_status !== 'exported') { r.sync_status = 'exported'; await DB.put(r); }
    }
    if (state.view === 'home') renderHome();
  }

  // One-tap "Send": hand the CSV to the phone's native share sheet (WhatsApp,
  // email, Drive, Bluetooth…). No backend — the interviewer picks where it
  // goes. Falls back to a plain download where file-sharing isn't supported
  // (e.g. desktop browsers), so it always does something useful.
  async function doSend(includeName) {
    const all = await DB.getAll();
    const { records, completed } = recordsToExport(all);
    if (!records.length) { alert('No interviews to send yet.'); return; }
    const csv = EXPORTER.toCSV(records, includeName);
    const fname = `mca_hunt_${includeName ? 'named' : 'anon'}_${EXPORTER.timestamp()}.csv`;
    try {
      const file = new File([csv], fname, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: 'MCA Hunting Survey interviews',
          text: `MCA Hunting Survey — ${records.length} interview(s) from ${interviewerId() || 'this device'}.`,
        });
        await markExported(completed);
        return;
      }
    } catch (e) {
      // Share cancelled or unsupported mid-flight → fall through to download.
      if (e && e.name === 'AbortError') return; // user cancelled: do nothing
    }
    // Fallback: download the file so the interviewer can attach it manually.
    EXPORTER.download(fname, csv, 'text/csv;charset=utf-8');
    await markExported(completed);
  }

  async function doExport(kind, includeName) {
    const all = await DB.getAll();
    const { records, completed } = recordsToExport(all);
    if (!records.length) { alert('No interviews to export yet.'); return; }
    const ts = EXPORTER.timestamp();
    if (kind === 'csv') {
      const csv = EXPORTER.toCSV(records, includeName);
      EXPORTER.download(`mca_hunt_${includeName ? 'named' : 'anon'}_${ts}.csv`, csv, 'text/csv;charset=utf-8');
    } else {
      const json = EXPORTER.toJSON(records, includeName);
      EXPORTER.download(`mca_hunt_${ts}.json`, json, 'application/json');
    }
    await markExported(completed);
  }

  // --- Bootstrap -----------------------------------------------------------
  async function init() {
    await DB.open();
    await loadReference();
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('click', onClick);
    if (!interviewerId()) renderInterviewerSetup(); else renderHome();

    // Only register the service worker for the hosted build (http/https).
    // The single-file build opened from disk (file://) skips this — it is
    // already fully offline and SW registration would just error.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }

  window.addEventListener('DOMContentLoaded', init);
})();

  </script>
</body>
</html>
